# Genera el instalador de Windows (.exe y .msi) y lo adjunta como borrador de
# release en GitHub. La etiqueta vX.Y.Z se crea sola a partir de la versión de
# src-tauri/tauri.conf.json.
#
# Se lanza de tres formas:
#   - publicando una etiqueta v*
#   - subiendo cambios a la rama `release`
#   - a mano desde la pestaña Actions → Release → Run workflow
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "WidWatch v__VERSION__"
          releaseBody: "Descarga el instalador `.exe` o `.msi` de abajo."
          releaseDraft: true
